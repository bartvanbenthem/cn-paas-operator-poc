---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lokistacks.loki.grafana.com
spec:
  group: loki.grafana.com
  names:
    kind: LokiStack
    listKind: LokiStackList
    plural: lokistacks
    singular: lokistack
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Trimmed, envtest-only copy of the real LokiStack CRD from
          github.com/grafana/loki's operator/ subtree (see
          external-crds/crd-loki-operator-v0.11.0.yaml for the full,
          vendored schema this was derived from). Only the fields
          internal/loki's BuildManifest actually reads or writes are modeled
          here; every field path below was verified directly against that
          real schema.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              size:
                type: string
                enum:
                - 1x.demo
                - 1x.pico
                - 1x.extra-small
                - 1x.small
                - 1x.medium
              storageClassName:
                type: string
              storage:
                properties:
                  schemas:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: string
                          enum:
                          - v11
                          - v12
                          - v13
                        effectiveDate:
                          type: string
                          pattern: ^([0-9]{4,})([-]([0-9]{2})){2}$
                      required:
                      - version
                      - effectiveDate
                  secret:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum:
                        - azure
                        - gcs
                        - s3
                        - swift
                        - alibabacloud
                    required:
                    - name
                    - type
                required:
                - schemas
                - secret
                type: object
            required:
            - storage
            - storageClassName
            type: object
          status:
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
