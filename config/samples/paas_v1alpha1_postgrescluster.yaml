apiVersion: paas.cncp.nl/v1alpha1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: paas-operator
    app.kubernetes.io/managed-by: kustomize
  name: example-db
spec:
  instances: 3
  image: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 10Gi
    # storageClass is optional; omit it to use the cluster's default
    # StorageClass. Set it explicitly if your cluster doesn't have one
    # (e.g. "storageClass: standard").
  database:
    name: app
    owner: app
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
