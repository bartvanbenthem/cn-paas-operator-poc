---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-paas-cncp-nl-v1alpha1-grafanainstance
  failurePolicy: Fail
  name: vgrafanainstance-v1alpha1.kb.io
  rules:
  - apiGroups:
    - paas.cncp.nl
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - grafanainstances
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-paas-cncp-nl-v1alpha1-lokiinstance
  failurePolicy: Fail
  name: vlokiinstance-v1alpha1.kb.io
  rules:
  - apiGroups:
    - paas.cncp.nl
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - lokiinstances
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-paas-cncp-nl-v1alpha1-prometheusinstance
  failurePolicy: Fail
  name: vprometheusinstance-v1alpha1.kb.io
  rules:
  - apiGroups:
    - paas.cncp.nl
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - prometheusinstances
  sideEffects: None
